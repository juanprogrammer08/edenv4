services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eden
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d eden']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Declara AUTH_SECRET en el entorno}
      DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/eden
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-6}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports: ['8080:80']
    depends_on: [api]
volumes:
  pgdata: {}
